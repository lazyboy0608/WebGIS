# Redis Configuration for WebGIS Seismic Platform
# Optimized for high-throughput MVT Vector Tiles caching & Task Pub/Sub

# Network
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management (Production Limits)
# 2GB max memory for single-server deployment
maxmemory 2gb
# LRU eviction ensures oldest cached tiles/geojson are evicted when memory is full
maxmemory-policy allkeys-lru

# Persistence (AOF for durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Performance & Logging
loglevel notice
databases 16
