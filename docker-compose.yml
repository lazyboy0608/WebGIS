services:
  # ============================================================
  # 1. Nginx Single Web Gateway (Port 80 Mở ra Mạng LAN)
  # ============================================================
  gateway:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webgis-gateway
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - segy-processing
      - data-serving
    networks:
      - webgis-network

  # ============================================================
  # 2. Redis Cache & Pub/Sub Engine (Nội bộ Docker)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: webgis-redis
    restart: always
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - webgis-network

  # ============================================================
  # 3. PostGIS Spatial Database (Nội bộ Docker)
  # ============================================================
  postgis:
    image: postgis/postgis:15-3.4-alpine
    container_name: webgis-postgis
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webgis}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-06082004}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-webgis}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - webgis-network

  # ============================================================
  # 4. MinIO S3 Object Storage (Nội bộ Docker)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: webgis-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webgis-network

  # ============================================================
  # 5. SEG-Y Processing Service (Backend 1: Port 8000 Nội bộ)
  # ============================================================
  segy-processing:
    build:
      context: ./backend/segy-processing-service
      dockerfile: Dockerfile
    container_name: webgis-segy-processing
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-06082004}@postgis:5432/${POSTGRES_DB:-webgis}
      REDIS_URL: redis://redis:6379/1
      REDIS_DATA_SERVING_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
      STORAGE_TYPE: minio
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-in-production-2026}
      JWT_ALGORITHM: HS256
    depends_on:
      redis:
        condition: service_healthy
      postgis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - webgis-network

  # ============================================================
  # 6. Data Serving Service (Backend 2: Port 8001 Nội bộ)
  # ============================================================
  data-serving:
    build:
      context: ./backend/data-serving
      dockerfile: Dockerfile
    container_name: webgis-data-serving
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-06082004}@postgis:5432/${POSTGRES_DB:-webgis}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-in-production-2026}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    depends_on:
      redis:
        condition: service_healthy
      postgis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - webgis-network

networks:
  webgis-network:
    driver: bridge

volumes:
  redis_data:
    name: webgis_redis_data
  postgis_data:
    name: webgis_postgis_data
  minio_data:
    name: webgis_minio_data
