version: '3.8'

services:
  # ============================================================
  # Redis Cache & Pub/Sub (Single-Server All-in-One Engine)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: webgis-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./tools/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # PostGIS Database
  # ============================================================
  postgis:
    image: postgis/postgis:15-3.4-alpine
    container_name: webgis-postgis
    restart: always
    environment:
      POSTGRES_DB: webgis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-06082004}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webgis"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # MinIO Object Storage
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: webgis-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # SEG-Y Processing Service (Port 8000)
  # ============================================================
  segy-processing:
    build:
      context: ./backend/segy-processing-service
      dockerfile: Dockerfile
    container_name: webgis-segy-processing
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-06082004}@postgis:5432/webgis
      REDIS_URL: redis://redis:6379/1
      REDIS_DATA_SERVING_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
      STORAGE_TYPE: minio
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ============================================================
  # Data Serving Service (Port 8001)
  # ============================================================
  data-serving:
    build:
      context: ./backend/data-serving
      dockerfile: Dockerfile
    container_name: webgis-data-serving
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-06082004}@postgis:5432/webgis
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      postgis:
        condition: service_healthy

volumes:
  redis_data:
  postgis_data:
  minio_data:
