upstream segy_processing_upstream {
    server segy-processing:8000;
}

upstream data_serving_upstream {
    server data-serving:8001;
}

upstream minio_storage_upstream {
    server minio:9000;
}

# ============================================================
# 1. HTTP Server Block — Chuyen huong 301 tu HTTP sang HTTPS
# ============================================================
server {
    listen 80;
    server_name seismicatlas.local localhost _;

    # Chuyen huong toan bo truy cap khong ma hoa sang HTTPS
    return 301 https://$host$request_uri;
}

# ============================================================
# 2. HTTPS Server Block — Cong 443 Bao mat (TLS 1.3 / TLS 1.2)
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name seismicatlas.local localhost _;

    # ── SSL Certificates ─────────────────────────────────────
    ssl_certificate /etc/nginx/certs/seismicatlas.crt;
    ssl_certificate_key /etc/nginx/certs/seismicatlas.key;

    # ── TLS Protocols & Cipher Suite (Bao mat cao) ───────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # ── SSL Session Caching & Optimization ───────────────────
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── OWASP HTTP Security Headers ──────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Maximum file upload size for seismic SEG-Y files (2GB)
    client_max_body_size 2048M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml
        application/x-protobuf;

    # Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Static Assets Caching (JS, CSS, Images, Fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # 1. Routing to Backend 1: SEG-Y File Upload & Header Inspection
    location /api/segy-files/inspect-header {
        proxy_pass http://segy_processing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/segy-files/crs-presets {
        proxy_pass http://segy_processing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/segy-files/upload {
        proxy_pass http://segy_processing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 60s;
        proxy_request_buffering off;
        client_max_body_size 2048M;
    }

    # 2. Routing to Backend 1: Batch Delete
    location /api/segy-files/batch-delete {
        proxy_pass http://segy_processing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3. Routing to Backend 1: Seismic Block Shapefile Upload & Tasks
    location /api/blocks/upload-zip {
        proxy_pass http://segy_processing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 500M;
    }

    location /api/blocks/tasks {
        proxy_pass http://segy_processing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 4. Routing to Backend 1: WebSocket Progress
    location /api/segy-files/ws {
        proxy_pass http://segy_processing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 5. Routing to Backend 1: Task Status
    location /api/segy-files/tasks {
        proxy_pass http://segy_processing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 6. Routing to Backend 2: All other API endpoints (Auth, Users, Blocks, Surveys, MVT Tiles, Excel)
    location /api/ {
        proxy_pass http://data_serving_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 7. Routing to MinIO S3 Object Storage for CSV / SEG-Y / Block Exports
    location ~* ^/(raw-segy|processed-segy|blocks-raw-inputs|user-avatars)/ {
        proxy_pass http://minio_storage_upstream;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        client_max_body_size 2048M;
    }
}

