[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "segy-processing-service"
version = "0.1.0"
description = "Python backend service for processing SEG-Y seismic data"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "python-multipart",
    "uvicorn[standard]",
    "httpx2",
    "segyio>=1.9,<2.0",
    "numpy>=1.26,<3.0",
    "pyproj>=3.7,<4.0",
    "shapely>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "geoalchemy2>=0.15,<1.0",
    "python-dotenv>=1.0,<2.0",
]


[tool.black]
line-length = 88
target-version = ["py313"]
exclude = '''
/(
    \.venv
    |\.git
    |__pycache__
    |\.pytest_cache
    |\.mypy_cache
    |\.ruff_cache
    |build
    |dist
)/
'''


[tool.ruff]
line-length = 88
target-version = "py313"

exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
]

ignore = [
    "E501",
]


[tool.ruff.lint.isort]
known-first-party = ["app"]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

pythonpath = [
    ".",
]

addopts = "-ra"


[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "app"

exclude = [
    "^tests/",
]